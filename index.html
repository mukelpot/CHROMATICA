/* Layout: a full-screen 3D hero, then one centred editorial column on deep indigo, set like the concert posters */
:root{
  --bg:#05060f; --bg-2:#0c0d29; --panel:rgba(255,255,255,.045);
  --ink:#f4f2ff; --ink-2:#d4d1ec; --muted:rgba(232,228,255,.62); --line:rgba(232,228,255,.14);
  --cat1:#f06aa8; --cat2:#f6cf6a; --cat3:#7fdcea;
  --holo:linear-gradient(90deg,#eef1fb 0,#cdeffa 10%,#fde9a6 20%,#fbd856 31%,#f8a63a 42%,#f4664f 53%,#f04a98 63%,#de78d2 73%,#9ea2f2 86%,#86d8f0 100%);
  --holo-v:linear-gradient(180deg,#cdeffa 0,#fbd856 30%,#f4664f 55%,#f04a98 72%,#9ea2f2 100%);
  --cat4:#b9b4d8;
  --display:'Tinos','Times New Roman',Times,serif;
  --caps:'Bodoni Moda',Didot,Georgia,serif;
  --body:'Tinos','Times New Roman',Times,serif;
  --gutter:clamp(16px,5vw,56px);
  --col:780px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{overflow-x:hidden;font-family:var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
::selection{background:rgba(240,106,168,.45)}

/* ---------- 3D canvas: fixed behind the hero, fades out as the hero scrolls away */
#gl{position:fixed;inset:0;width:100%;height:100vh;height:100lvh;display:block;touch-action:pan-y;cursor:grab;z-index:0}
#gl.dragging{cursor:grabbing}

/* ---------- hero */
.hero{position:relative;z-index:1;height:100vh;height:100svh;min-height:540px;pointer-events:none;overflow:hidden}
.ui{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.ui.on{opacity:1}
.c{position:absolute;font-family:var(--caps);font-weight:600;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;line-height:1.75}
.tl{top:max(24px,env(safe-area-inset-top));left:30px}
.tr{top:max(24px,env(safe-area-inset-top));right:30px;text-align:right}
.br{bottom:max(30px,calc(env(safe-area-inset-bottom) + 12px));right:30px;text-align:right;color:var(--muted);transition:opacity .5s ease}
.br.gone{opacity:0}
.brand b{display:block;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.1em;line-height:1.1}
.muted{color:var(--muted)}
.arrow{display:inline-block;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.fps{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;color:#fff;background:rgba(0,0,0,.55);padding:6px 9px;border-radius:6px}

/* hero title: live HTML text over the 3D canvas */
.title{position:absolute;left:50%;top:50%;margin:0;width:var(--tw,80vw);transform:translate(-50%,-50%);display:flex;flex-direction:column;font-weight:400;-webkit-user-select:none;user-select:none}
.title.portrait{top:21%}
.word{position:relative;left:50%;align-self:flex-start;width:max-content;display:inline-block;white-space:nowrap;font-family:var(--display);font-size:var(--fs,120px);line-height:.8;padding-block:.06em;transform:translateX(-50%) scaleX(.8);transform-origin:50% 50%;filter:drop-shadow(0 .012em .045em rgba(5,3,20,.92)) drop-shadow(0 0 .03em rgba(220,206,255,.42));will-change:filter}
.lw{display:inline-block;will-change:transform,opacity;opacity:0}
body.nogl .lw,body.nogl .caps{opacity:1}
.l{display:inline-block;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:
    linear-gradient(100deg,rgba(255,255,255,0) 0,rgba(255,255,255,0) 44%,rgba(255,255,255,.8) 50%,rgba(255,255,255,0) 56%,rgba(255,255,255,0) 100%),
    radial-gradient(circle,rgba(20,10,60,.12) 0,rgba(20,10,60,.12) 28%,rgba(20,10,60,0) 40%),
    linear-gradient(180deg,rgba(255,255,255,.45) 0,rgba(255,255,255,0) 35%,rgba(255,255,255,0) 80%,rgba(255,255,255,.18) 100%),
    var(--holo);
  background-size:var(--W,100%) 100%,2px 2px,100% 100%,var(--W,100%) 100%;
  background-position:var(--gx,-99999px) 0,0 0,0 0,var(--x,0) 0;
  background-repeat:no-repeat,repeat,no-repeat,no-repeat}
.caps{font-family:var(--caps);font-weight:600;font-size:var(--cs,11px);line-height:1;letter-spacing:.42em;text-transform:uppercase;color:#f4f1ff;white-space:nowrap;filter:drop-shadow(0 0 .3em rgba(5,3,20,.95));opacity:0}
.caps-top{align-self:flex-start;margin-bottom:calc(var(--fs,120px) * .05)}
.caps-bot{align-self:flex-end;margin-top:calc(var(--fs,120px) * .06);margin-right:-.42em}

/* ===================================================================== CHROMATICA concert booklet: cover → glow → booklet */
:root{--top:64px;--side:max(7vw,112px);--maxw:1240px;--a1:#e3e6f0;--a2:#6aa8ff;--a3:#ff9468;--a4:#f7c95c;
  --g1:linear-gradient(90deg,#ffffff 0,#b9bed0 30%,#ffffff 52%,#8a90a6 78%,#f2f4fb 100%);
  --g2:linear-gradient(90deg,#d6e6ff 0,#6aa8ff 34%,#8f7bff 64%,#ff6fae 100%);
  --g3:linear-gradient(90deg,#ffe0a0 0,#ffb04d 26%,#ff7a59 52%,#ff5fa8 76%,#c86bff 100%);
  --ease:cubic-bezier(.2,.75,.2,1)}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
body{min-height:100vh}
#gl{z-index:0}
body.title-on #gl{touch-action:none;cursor:pointer}
body.booklet-on #gl{touch-action:pan-y;cursor:grab}
#gl.dragging{cursor:grabbing}
.spark{width:14px;height:14px;flex:none;fill:url(#holoFill)}
a:focus-visible,button:focus-visible{outline:2px solid var(--cat3);outline-offset:4px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the cover */
.hero{position:fixed;inset:0;height:auto;min-height:0;z-index:3;touch-action:none}
body:not(.title-on) .hero{visibility:hidden}
.bl{bottom:max(28px,calc(env(safe-area-inset-bottom) + 14px));left:30px}
.enter{position:absolute;left:50%;bottom:max(13vh,calc(env(safe-area-inset-bottom) + 96px));transform:translateX(-50%);display:inline-flex;align-items:center;gap:12px;padding:17px 30px 16px;border:0;background:rgba(5,6,15,.28);color:var(--ink);font-family:var(--caps);font-weight:600;font-size:11px;letter-spacing:.4em;text-transform:uppercase;white-space:nowrap;cursor:pointer;pointer-events:auto;--b:rgba(244,242,255,.9);transition:background .3s ease}
.enter::before{content:"";position:absolute;inset:0;pointer-events:none;transition:inset .35s var(--ease);background:
 linear-gradient(var(--b),var(--b)) 0 0/12px 1px no-repeat,linear-gradient(var(--b),var(--b)) 0 0/1px 12px no-repeat,
 linear-gradient(var(--b),var(--b)) 100% 0/12px 1px no-repeat,linear-gradient(var(--b),var(--b)) 100% 0/1px 12px no-repeat,
 linear-gradient(var(--b),var(--b)) 0 100%/12px 1px no-repeat,linear-gradient(var(--b),var(--b)) 0 100%/1px 12px no-repeat,
 linear-gradient(var(--b),var(--b)) 100% 100%/12px 1px no-repeat,linear-gradient(var(--b),var(--b)) 100% 100%/1px 12px no-repeat}
.enter::after{content:"";position:absolute;inset:-14px -30px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(240,74,152,.28),rgba(158,162,242,.12) 55%,rgba(0,0,0,0));animation:breathe 2.6s ease-in-out infinite}
.enter .spark{width:12px;height:12px;margin-left:-6px}
.enter:hover{background:rgba(255,255,255,.07)}
.enter:hover::before{inset:-6px}
@keyframes breathe{50%{opacity:.35;transform:scale(.94)}}
.enter-hint{position:absolute;left:50%;bottom:max(calc(13vh - 34px),calc(env(safe-area-inset-bottom) + 62px));transform:translateX(-50%);font-family:var(--caps);font-weight:600;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);white-space:nowrap}


/* All the small capitals (the cover's lines, tabs, buttons, labels, credits) are in the poster's font, Times New Roman
   Bold: here as Tinos, its free twin with the same letter widths (Times New Roman itself can't be built into a
   website). Only the bold face is embedded, so every weight asked for with --caps draws it. Same sizes, spacing and
   colours as before. Titles, SMU VOIX and the italic lines keep Instrument Serif; sentences keep Instrument Sans. */
:root{--caps:'Tinos','Times New Roman',Times,serif}
body.entering .ui{opacity:0;transition:opacity .45s ease}
body.entering .enter{pointer-events:none}

/* the glow between the cover and the booklet, and the band of light that crosses the screen as pages turn */
.flash{position:fixed;inset:-25%;z-index:9;pointer-events:none;opacity:0;will-change:opacity,transform;
  background:radial-gradient(circle at 50% 50%,#fff 0,#fdf9ff 14%,#ece2ff 30%,rgba(196,170,255,.86) 46%,rgba(240,74,152,.42) 62%,rgba(12,10,40,0) 80%)}
.sweep{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:8;pointer-events:none;overflow:hidden} /* sized to the large viewport: a phone's toolbar growing or shrinking doesn't touch it */
.sweep i{position:absolute;top:-40%;bottom:-40%;left:0;width:74vw;opacity:0;mix-blend-mode:screen;will-change:transform,opacity;
  background:linear-gradient(90deg,rgba(134,216,240,0) 0,rgba(134,216,240,.14) 14%,rgba(251,216,86,.22) 30%,rgba(255,250,240,.5) 48%,rgba(255,255,255,.56) 50%,rgba(240,74,152,.26) 66%,rgba(158,162,242,.18) 84%,rgba(158,162,242,0) 100%)}
.sweep.go i{animation:sweep 1.15s cubic-bezier(.45,.05,.3,1) both}
.sweep.go.back i{animation-name:sweepBack}
@keyframes sweep{0%{transform:translateX(-80vw) skewX(-16deg);opacity:0}16%,78%{opacity:1}100%{transform:translateX(130vw) skewX(-16deg);opacity:0}}
@keyframes sweepBack{0%{transform:translateX(130vw) skewX(16deg);opacity:0}16%,78%{opacity:1}100%{transform:translateX(-80vw) skewX(16deg);opacity:0}}

/* ---------- the booklet shell */
body:not(.booklet-on) .booklet{display:none}
.booklet{position:relative;z-index:2}
/* top bar: logo (the index), the pages, and where you are */
.topbar{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:16px;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 268px 0 26px;background:linear-gradient(180deg,rgba(5,6,15,.86),rgba(5,6,15,.55) 58%,rgba(5,6,15,0));pointer-events:none;opacity:0;transition:opacity .8s ease .2s}
body.shell-on .topbar{opacity:1}
.topbar>*{pointer-events:auto}
.topbar::before{content:"";position:absolute;inset:0 0 -22px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(5,6,15,.96) 0,rgba(5,6,15,.9) calc(100% - 24px),rgba(5,6,15,0));opacity:0;transition:opacity .45s ease}
body.scrolled .topbar::before{opacity:1}
.logo{flex:none;display:inline-flex;align-items:center;padding:6px 2px;color:var(--ink);text-decoration:none;font-family:var(--display);font-size:24px;line-height:1;letter-spacing:.06em}
.logo span{display:inline-block;width:7.1em;transform:scaleX(.82);transform-origin:0 50%;color:transparent;background-image:var(--holo);-webkit-background-clip:text;background-clip:text}
.logo .spark{display:none;width:18px;height:18px}
.tabs{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
.tabs a{position:relative;flex:none;display:inline-flex;align-items:center;gap:7px;padding:10px 10px 8px;border-bottom:1.5px solid transparent;color:rgba(232,228,255,.55);font-family:var(--caps);font-weight:600;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;transition:color .25s ease}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-image:var(--holo) 1}
.tab-acts{display:inline-flex;align-items:center;gap:0;margin:0 6px;padding:0 4px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.tab-acts a{padding-left:9px;padding-right:9px;letter-spacing:.12em}
.tab-acts a i{width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.6;transition:opacity .25s,box-shadow .25s}
.tab-acts a:nth-child(5) i{background:conic-gradient(#fbd856,#f04a98,#9ea2f2,#86d8f0,#fbd856)}
.tab-acts a.on i,.tab-acts a:hover i{opacity:1;box-shadow:0 0 10px var(--c)}
.tab-acts a::after{content:attr(data-name);position:absolute;top:100%;left:50%;transform:translate(-50%,4px);padding:5px 9px;background:rgba(5,6,15,.9);border:1px solid var(--line);color:var(--ink-2);font-size:8.5px;letter-spacing:.24em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.tab-acts a:hover::after{opacity:1;transform:translate(-50%,8px)}
/* when the pages don't all fit along the top: one long pill naming the page you're on, with the menu lines at its end; it opens the contents */
.ct-btn{display:none;flex:0 1 380px;min-width:0;margin-left:auto;align-items:center;justify-content:space-between;gap:14px;min-height:38px;padding:0 13px 0 18px;border:1px solid rgba(232,228,255,.26);border-radius:999px;background:rgba(5,6,15,.35);color:var(--ink);font-family:var(--caps);font-weight:600;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;text-align:left;cursor:pointer;transition:background .25s,border-color .25s}
.ct-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.45)}
.ct-btn svg{flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.here{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.here i{display:inline-block;width:6px;height:6px;margin:0 9px 1px 0;border-radius:50%;background:var(--c,var(--ink));vertical-align:middle}
body.tabs-collapsed .tabs{display:none}
body.tabs-collapsed .ct-btn{display:inline-flex}
.progress{position:absolute;left:0;right:0;top:0;height:2px;background:var(--holo);transform-origin:0 50%;transform:scaleX(0);opacity:.85}

/* previous / next page: round buttons at the sides; on hover they name the page they lead to */
.nav-arrow{position:fixed;z-index:5;top:50%;width:52px;height:52px;margin-top:-26px;display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid rgba(232,228,255,.4);background:rgba(5,6,15,.45);color:var(--ink);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s ease,border-color .25s ease,background .25s ease,transform .35s var(--ease)}
body.shell-on .nav-arrow{opacity:1;pointer-events:auto}
body.shell-on .nav-arrow[disabled]{opacity:0;pointer-events:none}
.nav-arrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-arrow.prev{left:max(24px,env(safe-area-inset-left))}
.nav-arrow.next{right:max(24px,env(safe-area-inset-right))}
.nav-arrow:hover{border-color:rgba(255,255,255,.65);background:rgba(255,255,255,.08)}
.nav-arrow:active{transform:scale(.94)}
.nav-arrow-t{position:absolute;top:62px;left:0;white-space:nowrap;font-family:var(--caps);font-weight:600;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);opacity:0;transition:opacity .25s ease;pointer-events:none;text-shadow:0 0 10px rgba(5,6,15,.95)}
.nav-arrow.next .nav-arrow-t{left:auto;right:0}
.nav-arrow:hover .nav-arrow-t,.nav-arrow:focus-visible .nav-arrow-t{opacity:.85}
.nav-arrow.hint{animation:hint 2s ease-in-out infinite}
@keyframes hint{50%{border-color:rgba(255,255,255,.75);box-shadow:0 0 26px rgba(240,74,152,.45),0 0 0 6px rgba(240,74,152,.08)}}

/* now singing: on an act page, which song you're reading (with a step to the songs either side) */
.now{position:fixed;z-index:5;left:50%;bottom:max(22px,calc(env(safe-area-inset-bottom) + 10px));display:flex;align-items:center;gap:6px;max-width:min(520px,calc(100vw - 260px));padding:5px;border:1px solid rgba(232,228,255,.22);border-radius:999px;background:rgba(6,7,20,.78);box-shadow:0 12px 40px rgba(0,0,0,.35);transform:translate(-50%,calc(100% + 40px));opacity:0;pointer-events:none;transition:transform .55s var(--ease),opacity .35s ease}
body.now-on .now{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.now-b{flex:none;width:34px;height:34px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;transition:background .2s}
.now-b:hover{background:rgba(255,255,255,.1)}
.now-b[disabled]{opacity:.25;pointer-events:none}
.now-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}



.now-txt{min-width:0;display:flex;align-items:baseline;gap:10px;white-space:nowrap;overflow:hidden}
.now-txt small{font-family:var(--caps);font-weight:600;font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.now-txt b{font-family:var(--display);font-style:italic;font-weight:400;font-size:17px;color:var(--c,var(--ink))}
.now-txt span{min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--display);font-size:19px;line-height:1.1;padding-right:6px}

/* pins: one per act, floating around the sculpture on the index page */
.pins{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .8s ease .4s}
body.shell-on .pins{opacity:1}
.pin{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;color:var(--ink);text-decoration:none;pointer-events:auto;visibility:hidden;will-change:transform,opacity}
.pin i{position:absolute;inset:0;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px rgba(255,255,255,.1),0 0 18px var(--c)}
.pin[data-act="4"] i{background:conic-gradient(#fbd856,#f04a98,#9ea2f2,#86d8f0,#fbd856);box-shadow:0 0 0 4px rgba(255,255,255,.1),0 0 18px rgba(247,201,92,.9)}
.pin i::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(255,255,255,.55);animation:ping 2.4s ease-out infinite;animation-delay:calc(var(--k,0) * -.6s)}
@keyframes ping{0%{transform:scale(.45);opacity:.9}80%,100%{transform:scale(2.1);opacity:0}}
.pin span{position:absolute;top:50%;left:26px;display:flex;align-items:baseline;gap:8px;padding:7px 12px 6px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(6,7,20,.66);font-family:var(--caps);font-weight:600;font-size:9px;letter-spacing:.26em;text-transform:uppercase;white-space:nowrap;transform:translateY(-50%);transition:background .25s,color .25s,border-color .25s,opacity .16s}.pin.sw span{opacity:0}
.pin.l span{left:auto;right:26px}
.pin b{font-family:var(--display);font-style:italic;font-weight:400;font-size:15px;letter-spacing:.04em;color:var(--c)}
.pin[data-act="4"] b{color:#fbd856}
.pin em{font-style:normal;position:relative;top:-2px}
.pin:hover span,.pin:focus-visible span{background:var(--ink);color:#0b0a1f;border-color:var(--ink)}
.pin:hover b{color:#0b0a1f}









































/* ---------- pages */
.page{position:relative;z-index:1;min-height:100vh;pointer-events:none;outline:none;overflow-x:hidden;overflow-x:clip} /* clip: wide titles never make the page scroll sideways (and sticky still works) */
/* the page lets clicks through to the 3D wherever there's nothing to read (drag the sculpture around) */
.page :is(p,h1,h2,h3,ul,ol,dl,figure,a,button,blockquote,.card,.letter,.voices,.photos,.credits-wrap,.pager,.next-act,.acts){pointer-events:auto}
.pg{position:relative;transition:opacity .28s ease,transform .28s ease}
.page.out .pg{opacity:0;transform:translateY(-14px)}
.wrap{position:relative;max-width:calc(var(--maxw) + var(--side) * 2);margin:0 auto;padding:0 var(--side)}

/* page head: kicker, a big title whose letters rise into place, a line, then what's on the page */
.ph{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(var(--top) + 40px) var(--side) max(13vh,92px)}
.ph::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(4,5,14,.62) 0,rgba(4,5,14,.32) 38%,rgba(4,5,14,0) 62%),linear-gradient(0deg,rgba(4,5,14,.55),rgba(4,5,14,0) 40%);-webkit-mask:linear-gradient(180deg,#000 0,#000 84%,transparent 100%);mask:linear-gradient(180deg,#000 0,#000 84%,transparent 100%)} /* fades out at the foot, so no seam with the next section */
.ph>*{max-width:min(660px,48vw);position:relative}
.kicker{display:flex;gap:14px;align-items:center;margin:0 0 16px;font-family:var(--caps);font-weight:600;font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);white-space:nowrap;text-shadow:0 0 12px rgba(4,5,14,.95),0 0 3px rgba(4,5,14,.8)}
.kicker::before{content:"";flex:none;width:30px;height:1px;background:var(--holo)}
.ph-title{--fsz:clamp(54px,min(calc((100vw - var(--side) * 2) / (var(--len, 10) * .5)),11.5vw),168px);margin:0 0 20px;max-width:none!important;font-family:var(--display);font-weight:400;font-size:var(--fsz);line-height:.88;letter-spacing:.004em;text-transform:uppercase;white-space:nowrap;transform:scaleX(.86);transform-origin:0 50%;width:max-content;text-shadow:0 0 30px rgba(4,5,14,.45)}
.ph-title .wd{display:inline-block;overflow:hidden;padding:.06em .02em .1em 0;margin:-.06em 0 -.1em}
.ph-title .lt{display:inline-block;will-change:transform}
.ph-title.grad .lt{color:transparent;background-image:var(--grad,var(--holo));background-size:var(--W,100%) 100%;background-position:var(--x,0) 0;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;text-shadow:none}
.ph-line{margin:0 0 14px;font-family:var(--display);font-style:italic;font-size:clamp(24px,2.3vw,34px);line-height:1.15;color:var(--ink)}
.ph-blurb{margin:0;max-width:46ch!important;font-family:var(--body);font-size:15px;line-height:1.7;color:var(--ink-2)}
.cue{display:inline-flex;align-items:center;gap:10px;margin-top:30px;font-family:var(--caps);font-weight:600;font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.cue svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:bob 1.8s ease-in-out infinite}

/* entrances: words rise out of their masks; everything else fades up as it scrolls into view */
.pg:not(.in) .ph-title .lt{transform:translateY(108%)}
.pg.in .ph-title .lt{animation:rise 1s var(--ease) both;animation-delay:calc(140ms + var(--i) * 34ms)}
@keyframes rise{from{transform:translateY(108%)}to{transform:none}}
.ph .up{opacity:0;transform:translateY(16px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,.3s)}
.pg.in .ph .up{opacity:1;transform:none}
.rv{opacity:0;transform:translateY(26px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.dec .c{position:relative}
.dec .c.h{opacity:0}
.dec .c.s{color:transparent}
.dec .c.s::after{content:attr(data-g);position:absolute;left:0;top:0;color:#cdeffa;text-shadow:0 0 8px rgba(134,216,240,.65)}

/* buttons */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:.7em;min-height:52px;padding:0 30px;border:0;border-radius:999px;background:var(--ink);color:#0b0a1f;font-family:var(--caps);font-weight:600;font-size:11px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 10px 34px rgba(0,0,0,.4),0 0 30px rgba(240,74,152,.22);transition:background .35s ease}
.btn:hover{background:var(--holo)}
.btn .spark{width:13px;height:13px;margin-left:-4px}
.btn::after{content:"";position:absolute;top:-30%;bottom:-30%;left:-45%;width:38%;z-index:-1;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(240,74,152,.32) 40%,rgba(251,216,86,.36) 60%,rgba(255,255,255,0));transform:skewX(-18deg);animation:shine 4.5s ease-in-out infinite}
.btn:hover::after{animation:none;opacity:0}
@keyframes shine{0%,58%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(470%) skewX(-18deg)}}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 20px;border:1px solid rgba(232,228,255,.28);border-radius:999px;background:rgba(5,6,15,.3);color:var(--ink);font-family:var(--caps);font-weight:600;font-size:10px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,border-color .25s}
.ghost:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.5)}
.ghost svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.ghost:hover svg{transform:translateX(3px)}
.ghost.down:hover svg{transform:translateY(3px)}
.ghost[aria-disabled="true"]{opacity:.45;pointer-events:none}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}

/* section labels */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px 24px;margin:0 0 22px;padding-top:16px;border-top:1px solid var(--line)}
.sec-label{margin:0;font-family:var(--caps);font-weight:600;font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--ink)}
.sec-meta{margin:0;font-family:var(--caps);font-weight:600;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

/* ---------- index: the cover page of the booklet */
.ph-index .ph-title{--fsz:clamp(60px,10.5vw,176px)}
/* the index's CHROMATICA takes on the colours of the act you point at (pins and programme panels): its gradient is ten
   registered colours, so it glides from one act's colours to the next instead of jumping */
@property --h0{syntax:'<color>';inherits:true;initial-value:#eef1fb}
@property --h1{syntax:'<color>';inherits:true;initial-value:#cdeffa}
@property --h2{syntax:'<color>';inherits:true;initial-value:#fde9a6}
@property --h3{syntax:'<color>';inherits:true;initial-value:#fbd856}
@property --h4{syntax:'<color>';inherits:true;initial-value:#f8a63a}
@property --h5{syntax:'<color>';inherits:true;initial-value:#f4664f}
@property --h6{syntax:'<color>';inherits:true;initial-value:#f04a98}
@property --h7{syntax:'<color>';inherits:true;initial-value:#de78d2}
@property --h8{syntax:'<color>';inherits:true;initial-value:#9ea2f2}
@property --h9{syntax:'<color>';inherits:true;initial-value:#86d8f0}
.ph-index .ph-title{--h0:#eef1fb;--h1:#cdeffa;--h2:#fde9a6;--h3:#fbd856;--h4:#f8a63a;--h5:#f4664f;--h6:#f04a98;--h7:#de78d2;--h8:#9ea2f2;--h9:#86d8f0;--grad:linear-gradient(90deg,var(--h0) 0,var(--h1) 10%,var(--h2) 20%,var(--h3) 31%,var(--h4) 42%,var(--h5) 53%,var(--h6) 63%,var(--h7) 73%,var(--h8) 86%,var(--h9) 100%);transition:--h0 .7s ease,--h1 .7s ease,--h2 .7s ease,--h3 .7s ease,--h4 .7s ease,--h5 .7s ease,--h6 .7s ease,--h7 .7s ease,--h8 .7s ease,--h9 .7s ease}
body[data-preview="silhouette"] .ph-index .ph-title{--h0:#ffffff;--h1:#e8e9ef;--h2:#d0d4e0;--h3:#bcc1d2;--h4:#dfe1ea;--h5:#fafbfc;--h6:#ced0d9;--h7:#a1a5b7;--h8:#b0b4c5;--h9:#f2f4fb}
body[data-preview="pigment"] .ph-index .ph-title{--h0:#d6e6ff;--h1:#b6d4ff;--h2:#96c2ff;--h3:#74adff;--h4:#749cff;--h5:#818cff;--h6:#8e7cff;--h7:#ab78eb;--h8:#d374ce;--h9:#ff6fae}
body[data-preview="beyond"] .ph-index .ph-title{--h0:#f2e9ff;--h1:#e2d2ff;--h2:#d0b8ff;--h3:#bd9cff;--h4:#a98aff;--h5:#9a7bff;--h6:#a86cf0;--h7:#c862d0;--h8:#e85fa8;--h9:#ff5f8f}
body[data-preview="ombre"] .ph-index .ph-title{--h0:#ffe0a0;--h1:#ffce80;--h2:#ffbb60;--h3:#ffa64f;--h4:#ff8f54;--h5:#ff795c;--h6:#ff6e7d;--h7:#ff629e;--h8:#e864cc;--h9:#c86bff}
.facts-row{display:flex;flex-wrap:wrap;gap:4px 0;margin:0 0 10px;padding:0;list-style:none;font-family:var(--caps);font-weight:600;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink)}
.facts-row li+li::before{content:"·";margin:0 12px;color:var(--muted)}
.ph-sub{margin:0 0 14px;font-family:var(--display);font-style:italic;font-size:clamp(22px,2vw,30px);color:var(--ink)}
.advisory{margin:0;font-family:var(--body);font-size:13px;line-height:1.6;color:var(--muted)}
.menu{padding-top:30px;padding-bottom:80px}
.menu-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
.menu-list a{position:relative;display:flex;flex-direction:column;min-height:186px;padding:20px 22px 20px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.012) 60%),rgba(6,7,20,.55);color:var(--ink);text-decoration:none;overflow:hidden;transition:border-color .35s,background .35s,transform .45s var(--ease)}
.menu-list a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--holo);transform:scaleX(0);transform-origin:0 50%;transition:transform .6s var(--ease)}
.menu-list a:hover{border-color:rgba(232,228,255,.38);transform:translateY(-3px);background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 60%),rgba(6,7,20,.6)}
.menu-list a:hover::after{transform:scaleX(1)}
.mi-n{font-family:var(--display);font-style:italic;font-size:20px;line-height:1;color:var(--muted)}
.mi-t{margin-top:auto;font-family:var(--display);font-size:clamp(26px,2.3vw,34px);line-height:1;text-transform:uppercase;transform:scaleX(.9);transform-origin:0 50%}
.mi-d{margin-top:8px;font-family:var(--body);font-size:13px;line-height:1.5;color:var(--muted)}
.mi-go{position:absolute;top:18px;right:18px;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--muted);transition:transform .4s var(--ease),color .3s}
.menu-list a:hover .mi-go{transform:translateX(4px);color:var(--ink)}

/* the programme: the four acts as tall panels; the one you point at opens up */
.programme{padding-bottom:110px;scroll-margin-top:calc(var(--top) + 8px)}
.acts{display:flex;gap:10px;height:clamp(500px,70vh,660px)}
.act-card{position:relative;flex:1 1 0;min-width:0;overflow:hidden;border:1px solid var(--line);background:#07081a;transition:flex-grow .85s var(--ease),border-color .4s ease;--b:rgba(255,255,255,.85)}
.acts:hover .act-card{flex-grow:.8}
.acts .act-card:hover,.acts .act-card:focus-within{flex-grow:1.75;border-color:rgba(255,255,255,.4)}
.ac-art{position:absolute;inset:-3%;background-image:var(--fallback);background-size:cover;background-position:center;background-repeat:no-repeat;transform:scale(1.04);filter:brightness(.84) saturate(1.05);transition:transform 1.6s var(--ease),filter .6s ease,opacity .8s ease;opacity:1}
.ac-art.ready{background-image:var(--img),var(--fallback)}
.act-card:hover .ac-art,.act-card:focus-within .ac-art{transform:scale(1.11);filter:brightness(1.02) saturate(1.12)}
.act-card::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(0deg,rgba(4,5,14,.95) 0,rgba(4,5,14,.72) 32%,rgba(4,5,14,.12) 70%,rgba(4,5,14,.3) 100%)}
.act-card::after{content:"";position:absolute;inset:14px;z-index:2;pointer-events:none;opacity:0;transition:opacity .4s ease,inset .5s var(--ease);background:
 linear-gradient(var(--b),var(--b)) 0 0/16px 1px no-repeat,linear-gradient(var(--b),var(--b)) 0 0/1px 16px no-repeat,
 linear-gradient(var(--b),var(--b)) 100% 0/16px 1px no-repeat,linear-gradient(var(--b),var(--b)) 100% 0/1px 16px no-repeat,
 linear-gradient(var(--b),var(--b)) 0 100%/16px 1px no-repeat,linear-gradient(var(--b),var(--b)) 0 100%/1px 16px no-repeat,
 linear-gradient(var(--b),var(--b)) 100% 100%/16px 1px no-repeat,linear-gradient(var(--b),var(--b)) 100% 100%/1px 16px no-repeat}
.act-card:hover::after,.act-card:focus-within::after{opacity:.9;inset:10px}
.ac-num{position:absolute;z-index:2;top:16px;left:20px;font-family:var(--display);font-style:italic;font-size:clamp(70px,7vw,112px);line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.5);pointer-events:none;transition:-webkit-text-stroke-color .4s}
.act-card:hover .ac-num{-webkit-text-stroke-color:rgba(255,255,255,.85)}
.ac-body{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:22px 22px 20px;pointer-events:none}
.ac-kicker{display:flex;align-items:center;gap:9px;margin:0 0 8px;font-family:var(--caps);font-weight:600;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-2)}
.ac-kicker i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.act-card[data-act="4"] .ac-kicker i{background:conic-gradient(#fbd856,#f04a98,#9ea2f2,#86d8f0,#fbd856)}
.ac-name{display:block;margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(34px,3.2vw,52px);line-height:.95;text-transform:uppercase;transform:scaleX(.88);transform-origin:0 50%;white-space:nowrap}
/* the whole panel is one link (to the act); the song links inside sit above it */
.ac-link{position:absolute;inset:0;z-index:2}
/* the card's words sit above its link: let taps and clicks fall through to it (only the song links take their own) */
.act-card .ac-body :is(p,h3,ol,li,span){pointer-events:none}
.act-card .ac-songs a{pointer-events:auto}
.ac-line{margin:0 0 14px;font-family:var(--display);font-style:italic;font-size:17px;line-height:1.25;color:var(--ink-2)}
.ac-songs{display:grid;gap:2px;margin:0;padding:0;list-style:none;max-height:0;opacity:0;overflow:hidden;transition:max-height .7s var(--ease),opacity .5s ease}
.act-card:hover .ac-songs,.act-card:focus-within .ac-songs{max-height:220px;opacity:1}
.ac-songs a{position:relative;z-index:2;display:flex;align-items:baseline;gap:10px;padding:3px 0;color:var(--ink);text-decoration:none;font-family:var(--body);font-size:14px;white-space:nowrap;pointer-events:auto}
.ac-songs a b{font-family:var(--display);font-style:italic;font-weight:400;font-size:14px;color:var(--c)}
.act-card[data-act="4"] .ac-songs a b{color:#fbd856}
.ac-songs a:hover span{text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.4)}
.ac-count{display:block;margin-top:2px;font-family:var(--caps);font-weight:600;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);transition:opacity .3s}
.act-card:hover .ac-count,.act-card:focus-within .ac-count{opacity:0;height:0;overflow:hidden}
.interval{flex:none;width:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}
.interval::before,.interval::after{content:"";flex:1;width:1px;background:repeating-linear-gradient(180deg,rgba(232,228,255,.35) 0 3px,transparent 3px 8px)}
.interval span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--caps);font-weight:600;font-size:9px;letter-spacing:.34em;text-transform:uppercase;white-space:nowrap}

/* event details: at the end of the index (the programme comes first) */
.show{padding-bottom:30px}
.show-facts{display:grid;grid-template-columns:1.25fr .75fr 1fr 1.6fr;margin:0 0 18px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01) 60%),rgba(6,7,20,.55)}
.show-facts>div{padding:20px 22px 22px;border-left:1px solid var(--line)}
.show-facts>div:first-child{border-left:0}
.show-facts dt{margin:0 0 10px;font-family:var(--caps);font-weight:600;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.show-facts dd{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(20px,1.7vw,26px);line-height:1.2;color:var(--ink)}
.show .advisory{max-width:62ch}
.show .ctas{margin-top:22px}
.show .socials{justify-content:flex-start;margin-top:28px}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 24px;margin:26px 0 0;padding:0;list-style:none}
.socials a{display:inline-flex;align-items:center;gap:10px;font-family:var(--caps);font-weight:600;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;transition:color .25s}
.so-i{flex:none;display:grid;place-items:center;width:32px;height:32px;border:1px solid rgba(232,228,255,.24);border-radius:50%;background:rgba(5,6,15,.35);transition:border-color .25s,background .25s,box-shadow .25s}
.so-i svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.so-t{padding-bottom:2px;border-bottom:1px solid rgba(232,228,255,.3);transition:border-color .25s}
.socials a:hover{color:var(--ink)}
.socials a:hover .so-i{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.08);box-shadow:0 0 16px rgba(158,162,242,.35)}
.socials a:hover .so-i svg{stroke:url(#holoFill)}
.socials a:hover .so-t{border-color:var(--ink)}
/* a platform's official logo file (content.js ABOUT.socials, uploaded next to the booklet): shown as it is, in its own
   colours, in the same circle */
.so-i.has-logo svg{display:none}
.so-i.has-logo::after{content:"";width:16px;height:16px;background:var(--logo) center/contain no-repeat}
/* YouTube's official icon file has empty space built in around the mark (the mark is about two thirds of the file's
   width), so its box is bigger, to show the mark about as big as the others; the file itself is untouched */
.so-i.has-logo[data-so="youtube"]::after{width:24px;height:24px}

/* ---------- foreword: a letter */
.letter{position:relative;max-width:780px;margin:0 auto 100px;padding:clamp(34px,5vw,64px) clamp(22px,5vw,70px) clamp(30px,4vw,54px);background:linear-gradient(180deg,rgba(11,11,30,.86),rgba(7,7,20,.92));border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.letter::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--holo)}
.letter .lead{margin:0 0 26px;font-family:var(--display);font-size:clamp(28px,2.8vw,40px);line-height:1.12;color:var(--ink)}
.letter p{margin:0 0 1.15em;font-family:var(--body);font-size:17px;line-height:1.8;color:var(--ink-2)}
.letter .first::first-letter{float:left;margin:.08em .12em 0 0;font-family:var(--display);font-size:4.1em;line-height:.8;color:transparent;background:var(--holo);-webkit-background-clip:text;background-clip:text}
.sign{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:34px}
.letter .close{margin:34px 0 0;font-style:italic}
.letter .lead{text-wrap:balance}
.letter .close+.sign{margin-top:14px}
.flourish{width:200px;height:56px;margin:0 0 6px -6px;overflow:visible}
.flourish path{fill:none;stroke:url(#holoFill);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);transition:stroke-dashoffset 2.4s cubic-bezier(.45,0,.2,1) .2s}
.sign.in .flourish path{stroke-dashoffset:0}
.sign b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;color:var(--ink)}
.sign span{font-family:var(--caps);font-weight:600;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}

/* ---------- photos: a framed placeholder until the real picture arrives */
.photo{position:relative;margin:0;overflow:hidden;aspect-ratio:var(--ar,3/2);background:#090a1c;--b:rgba(244,242,255,.55)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.photo:hover img{transform:scale(1.03)}
.photo.soon{background:radial-gradient(120% 90% at 18% 0%,var(--c1,rgba(158,162,242,.28)) 0,rgba(0,0,0,0) 62%),radial-gradient(90% 80% at 100% 100%,var(--c2,rgba(240,74,152,.18)) 0,rgba(0,0,0,0) 58%),linear-gradient(160deg,#11132b,#07081a)}
.photo.soon::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 34px),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 34px)}
.photo.soon::after{content:"";position:absolute;inset:12px;pointer-events:none;transition:inset .5s var(--ease);background:
 linear-gradient(var(--b),var(--b)) 0 0/14px 1px no-repeat,linear-gradient(var(--b),var(--b)) 0 0/1px 14px no-repeat,
 linear-gradient(var(--b),var(--b)) 100% 0/14px 1px no-repeat,linear-gradient(var(--b),var(--b)) 100% 0/1px 14px no-repeat,
 linear-gradient(var(--b),var(--b)) 0 100%/14px 1px no-repeat,linear-gradient(var(--b),var(--b)) 0 100%/1px 14px no-repeat,
 linear-gradient(var(--b),var(--b)) 100% 100%/14px 1px no-repeat,linear-gradient(var(--b),var(--b)) 100% 100%/1px 14px no-repeat}
.photo.soon:hover::after{inset:7px}
.photo .soon-l{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgba(232,228,255,.6);font-family:var(--caps);font-weight:600;font-size:9px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.photo .soon-l svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.photo .soon-l small{font-size:8.5px;color:rgba(232,228,255,.38);letter-spacing:.26em}
.photo .shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.07) 48%,rgba(255,255,255,0) 60%);background-size:250% 100%;animation:shimmer 5.5s ease-in-out infinite;animation-delay:var(--sd,0s)}
@keyframes shimmer{0%,40%{background-position:120% 0}100%{background-position:-80% 0}}

/* ---------- about */
.about{padding-bottom:90px}
.about .photo{--ar:3/2;margin-bottom:clamp(36px,5vw,64px)}
.about-cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px clamp(30px,5vw,80px)}
.about-lead{margin:0;font-family:var(--display);font-size:clamp(34px,3.6vw,56px);line-height:1.02}
.about-lead em{font-style:italic;color:transparent;background:var(--holo);-webkit-background-clip:text;background-clip:text;padding-right:.06em}
.about-body p{margin:0 0 1.1em;font-family:var(--body);font-size:17px;line-height:1.8;color:var(--ink-2);max-width:62ch}
.about-body .socials{justify-content:flex-start;margin-top:28px}
.contact{margin:18px 0 0;font-family:var(--body);font-size:14px;color:var(--muted)}

/* ---------- an act */
.ph-act{--c:var(--a1)}
.act-numeral{position:absolute!important;z-index:-1;right:7vw;top:calc(var(--top) + 3vh);max-width:none!important;margin:0;font-family:var(--display);font-style:italic;font-size:min(62vh,44vw);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.13);pointer-events:none;will-change:transform}
.tracks{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 0;padding:0;list-style:none}
.tracks a{display:inline-flex;align-items:baseline;gap:8px;min-height:36px;padding:9px 14px 8px;border:1px solid rgba(232,228,255,.22);border-radius:999px;background:rgba(5,6,15,.38);color:var(--ink);text-decoration:none;font-family:var(--body);font-size:13px;line-height:1.1;white-space:nowrap;transition:background .25s,border-color .25s}
.tracks a b{font-family:var(--display);font-style:italic;font-weight:400;font-size:14px;color:var(--c)}
.tracks a:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.5)}
.songs{padding-bottom:40px}
.song{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0 clamp(28px,4.5vw,72px);padding:clamp(70px,11vh,130px) 0 clamp(60px,9vh,110px);border-top:1px solid var(--line);scroll-margin-top:calc(var(--top) + 10px)}
.song-meta{position:sticky;top:calc(var(--top) + 30px);align-self:start}
.song-n{margin:0 0 8px;font-family:var(--display);font-style:italic;font-size:clamp(70px,7.4vw,118px);line-height:.8;color:transparent;-webkit-text-stroke:1px var(--c);opacity:.95}
.song-title{margin:0 0 18px;font-family:var(--display);font-weight:400;font-size:clamp(42px,4.6vw,76px);line-height:.94;text-transform:uppercase;text-wrap:balance}
/* Chinese song titles (content.js lang): Noto Serif CJK, cut down to the characters used (tools/cjk_subset.py),
   sized to the Latin titles' capitals, and without the narrowing the Latin titles get */
.song-title:lang(zh-Hant),#nowT:lang(zh-Hant){font-family:'Tinos','Times New Roman','Booklet Serif TC','Noto Serif CJK TC','Noto Serif TC','Source Han Serif TC','Songti TC',PMingLiU,serif;font-weight:500}
.song-title:lang(zh-Hans),#nowT:lang(zh-Hans){font-family:'Tinos','Times New Roman','Booklet Serif SC','Noto Serif CJK SC','Noto Serif SC','Source Han Serif SC','Songti SC',SimSun,serif;font-weight:500}
.song-title:lang(zh){transform:none;width:auto;font-size:clamp(37px,4.05vw,67px);line-height:1.1;letter-spacing:.04em}
#nowT:lang(zh){font-size:17px;letter-spacing:.04em}
.song-credits{display:grid;gap:8px;margin:0 0 4px;padding:0;list-style:none}
.song-credits li{display:grid;grid-template-columns:128px minmax(0,1fr);align-items:baseline;gap:10px;font-family:var(--body);font-size:15.5px;color:var(--ink)}
.song-credits small{white-space:nowrap;font-family:var(--caps);font-weight:600;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
/* label column as wide as the longest label (e.g. "Choreographed by"), at least the old 128px / 118px */
.song-meta .song-credits{grid-template-columns:minmax(128px,max-content) minmax(0,1fr);column-gap:10px;row-gap:8px;align-items:baseline}
.song-meta .song-credits li{display:contents}
@media (max-width:760px),(max-aspect-ratio:4/5){.song-meta .song-credits{grid-template-columns:minmax(118px,max-content) minmax(0,1fr)}}
.medley{margin:14px 0 0;font-family:var(--display);font-style:italic;font-size:18px;line-height:1.5;color:var(--ink-2)}
.voices{margin-top:30px}
.lbl{display:flex;align-items:center;gap:12px;margin:0 0 8px;font-family:var(--caps);font-weight:600;font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.voices ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;margin:0;padding:0;list-style:none}
/* the voices (and dancers) read down the left column, then down the right one; --rows is half the list, rounded up */
.voices ul,.dancers ul{grid-auto-flow:column;grid-template-rows:repeat(var(--rows,1),auto)}
.voices li{display:grid;grid-template-columns:9px var(--pw,78px) minmax(0,1fr);align-items:center;gap:11px;min-width:0;padding:9px 0 8px;border-bottom:1px solid rgba(232,228,255,.08);cursor:default}
.voices li i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--vc);opacity:.35;transform:scale(.7);transition:opacity .5s ease,transform .5s var(--ease),box-shadow .5s ease;transition-delay:calc(var(--k) * 90ms)}
.voices li i.holo{background:conic-gradient(#fbd856,#f04a98,#9ea2f2,#86d8f0,#fbd856)}
.voices.in li i{opacity:1;transform:none;box-shadow:0 0 12px var(--vc)}
.voices li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--caps);font-weight:600;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.voices li b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--body);font-weight:400;font-size:15px;color:var(--ink)}
.voices li:hover i{transform:scale(1.35)}
/* narrow columns (booklet.js fitSongs): each part above its name, as on phones */
.voices ul.stack li{grid-template-columns:9px minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;row-gap:3px;padding:10px 0 9px}
.voices ul.stack li i{grid-row:1/3;align-self:center}
.voices ul.stack li span,.voices ul.stack li b{grid-column:2}
/* details taller than the screen scroll with the page instead of staying pinned (booklet.js fitSongs) */
.song-meta.no-pin{position:static}
/* dancers (e.g. SMU Indancity's): names only, in the same two columns as the voices */
.dancers{margin-top:26px}
.dancers .aka{color:var(--muted);font-style:italic;white-space:nowrap}
.song-meta .song-title+.performers{margin-top:30px}
.dancers ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;margin:0;padding:0;list-style:none}
.dancers li{min-width:0;padding:9px 0 8px;border-bottom:1px solid rgba(232,228,255,.08);font-family:var(--body);font-size:15px;line-height:1.35;color:var(--ink)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos .photo:first-child{grid-column:1/-1;--ar:3/2}
.photos .photo:not(:first-child){--ar:1/1}
.photos.single{grid-template-columns:1fr}
.photos.single .photo:first-child{--ar:1588/2246;width:100%;max-width:min(100%,calc((100vh - 120px) * .7071),760px);margin-inline:auto}
/* side-by-side layout: the poster is as tall as the song details (number to the last name), never wider than its column */
@media (min-width:1061px) and (min-aspect-ratio:4001/5000){.song-media{position:relative}.song-media .photos.single{display:block}.photos.single .photo:first-child{width:min(100%,calc((100vh - var(--top) - 56px) * .7071));max-width:none;height:auto;margin:0 auto;position:sticky;top:calc(var(--top) + 30px)}}
.song-about{margin-top:34px}

/* ===================================================================== lite edition: the same booklet, lighter on the device
   Added after exp.css. Only cheaper ways of drawing the same things: nothing on the page animates by repainting
   itself, there are no blend modes, and no wide blurs behind body text (those get redrawn as the page scrolls). */

/* photo frames: the shimmer slides across with a transform (moved by the compositor) instead of repainting the frame */
.photo .shine{inset:0 auto 0 0;width:70%;background:linear-gradient(105deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.07) 50%,rgba(255,255,255,0) 80%);animation-name:shimmerT;transform:translateX(-110%)}
@keyframes shimmerT{0%,40%{transform:translateX(-110%)}100%{transform:translateX(160%)}}

/* text over the light: tight shadows (quick to draw) instead of wide blurs */
.song-about p{text-shadow:0 0 2px rgba(4,5,14,.85),0 1px 3px rgba(4,5,14,.6)}
.kicker{text-shadow:0 0 4px rgba(4,5,14,.95),0 0 2px rgba(4,5,14,.8)}
.ph-title{text-shadow:0 0 14px rgba(4,5,14,.45)}

/* the band of light as pages turn: plain see-through light (a blend mode makes the browser redraw everything under it;

precision highp float;
#else

#endif
uniform vec2 uRes;
uniform vec4 uT;     // time, drift clock, size of the point of light, how near the point a pixel must be for its glow (squared)
uniform vec2 uGl;    // the glint's turn (cos, sin)
uniform vec4 uC;     // the point of light (where the strands gather), background parallax

// body and a bright line down its middle. They wander a little along their length (ph moves them along), and where
// they get thinner than a few pixels they melt into their average, so nothing shimmers.
float strands(float s, float u, float n, float ph, float fw){
  float x = (s * 0.5 + 0.5) * n;
  x += 0.5 * sin(u * 5.1 + ph) + 0.22 * sin(u * 13.7 - ph * 1.6 + s * 3.0); // they wander along their length
  x += 0.32 * sin(x * 1.9 + ph * 0.4); // and they're uneven: some wide, some fine

vec3 bokehC(float k){

vec3 silk(float x){ // the ribbons' satin colours: pink, gold, sky, lilac

ign": {"name": "Ang Wei Sheng", "role": "Chairperson, SMU ReVOIX"}}],lead:"Dear friends, family, and supporters of SMU VOIX,",body:["On behalf of SMU VOIX, it is my greatest pleasure to welcome you to Do You A Cappella (DYAC) 2026: CHROMATICA. At its heart, CHROMATICA celebrates the uniqueness that defines us and the connections that unite us. Just as different colours come together to form a vibrant rainbow, each of us brings our own unique voice, personality and story to create something truly special together.","Behind tonight\u2019s performance are countless hours of rehearsals, planning and late nights. To my fellow VOIX members, thank you for your resilience, passion and professionalism throughout this journey. Despite the challenges, you have continued to push yourselves and support one another. Seeing how much everyone has grown, both as performers and as individuals, has been the most meaningful part of this journey.","My heartfelt thanks also go to our collaborators, INDANCITY, 555 Beatbox and Gareth Fernandez for bringing new dimensions to our music. To our coaches, alumni and everyone who has supported us behind the scenes, thank you for your dedication and for making tonight possible.","To our families, friends and all who have supported us along the way, thank you for believing in us and sharing this special moment with us. Your encouragement means more than you know.","As the lights dim and the music begins, I hope you find something that resonates with you in the stories we share tonight. So sit back, enjoy the show and let us take you through a spectrum of harmonies."],close:"With heartfelt gratitude,",sign:{name:"Lennel Chua Jia Jie",role:"President, SMU VOIX"}},at={kicker:"Who we are",title:"About us",lead:"SMU VOIX, Redefining A Cappella.",body:["SMU VOIX is an a cappella group at Singapore Management University, Redefining A Cappella. Do You A Cappella is its annual production, where the different groups of VOIX members bring months of vocal and choreography practice to one stage."],photo:"about-group.jpg",contact:"",socials:[["Instagram","https://www.instagram.com/smuvoix?igsh=ZGplYjBxZDhmMmcy","social-instagram.png"],["Telegram","https://t.me/smuvoix","social-telegram.svg"],["Spotify","https://open.spotify.com/artist/1Lf5LnIDcHMDjPfewUL3Xi?si=FnpVPhDrRz2GCsXh9IyozQ","social-spotify.svg"],["TikTok","https://www.tiktok.com/@smuvoix?_t=8j7vp6RJFXs&_r=1","social-tiktok.png"],["Facebook","https://www.facebook.com/SMUVOIX?mibextid=PtKPJ9","social-facebook.png"],["YouTube","https://youtube.com/@SMUVOIX?si=j1a_L7UPVWZMpM-e","social-youtube.png"],["LinkedIn","https://www.linkedin.com/company/smuvoix/","social-linkedin.png"]]},Xa=e=>e.split(`
